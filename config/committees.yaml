# config/committees.yaml
# ======================
# Role A — Committee configurations for Fest Ops
#
# Five distinct committees compete for the same scarce resources.
# At least 3 committees want "main_auditorium_evening".
# At least 2 committees want "sound_system_A" and "projector_A".
# Substitutes are realistic alternatives within the same category.
#
# Priorities must sum to (approximately) 1.0 for each committee.
# Field descriptions:
#   turnout            – weight on maximising audience attendance
#   sponsor_visibility – weight on sponsor brand exposure
#   budget_sensitivity – weight on staying within a tight budget
#
# All resource IDs here must exist in config/resources.yaml.

committees:

  # --------------------------------------------------------------------------
  - id: "cultural_night"
    budget: 1000
    priorities:
      turnout: 0.60
      sponsor_visibility: 0.20
      budget_sensitivity: 0.20
    wanted_resources:
      - "main_auditorium_evening"
      - "sound_system_A"
      - "volunteers_10"
    substitutes:
      main_auditorium_evening:
        - "open_air_theatre_evening"
      sound_system_A: []          # no acceptable substitute for sound

  # --------------------------------------------------------------------------
  - id: "technical_fest"
    budget: 800
    priorities:
      turnout: 0.30
      sponsor_visibility: 0.50
      budget_sensitivity: 0.20
    wanted_resources:
      - "main_auditorium_evening"
      - "projector_A"
      - "volunteers_10"
    substitutes:
      main_auditorium_evening:
        - "open_air_theatre_evening"
      projector_A: []             # high-resolution projector essential

  # --------------------------------------------------------------------------
  - id: "sports"
    budget: 1200
    priorities:
      turnout: 0.70
      sponsor_visibility: 0.20
      budget_sensitivity: 0.10
    wanted_resources:
      - "sports_ground"
      - "volunteers_10"
      - "sound_system_A"
    substitutes:
      sports_ground: []           # no indoor substitute
      sound_system_A:
        - "projector_A"           # fallback for public-address announcements

  # --------------------------------------------------------------------------
  - id: "literary_fest"
    budget: 600
    priorities:
      turnout: 0.40
      sponsor_visibility: 0.25
      budget_sensitivity: 0.35
    wanted_resources:
      - "main_auditorium_evening"
      - "projector_A"
      - "volunteers_10"
    substitutes:
      main_auditorium_evening:
        - "open_air_theatre_evening"
      projector_A: []

  # --------------------------------------------------------------------------
  - id: "entrepreneurship"
    budget: 900
    priorities:
      turnout: 0.25
      sponsor_visibility: 0.60
      budget_sensitivity: 0.15
    wanted_resources:
      - "main_auditorium_evening"
      - "sound_system_A"
      - "projector_A"
    substitutes:
      main_auditorium_evening:
        - "open_air_theatre_evening"
      sound_system_A: []
      projector_A: []

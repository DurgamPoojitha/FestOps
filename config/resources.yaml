# config/resources.yaml
# =====================
# Role A — Available resources for Fest Ops
#
# Every resource ID referenced in committees.yaml MUST appear here.
# Fields:
#   id       – unique identifier (must match RESOURCE_VALUES in committee_agent.py)
#   type     – category: "venue" | "equipment" | "staff"
#   capacity – number of committees that can use this resource simultaneously
#              (1 = scarce/contested, >1 = shareable)

resources:

  - id: "main_auditorium_evening"
    type: "venue"
    capacity: 1          # only one committee can hold the main auditorium

  - id: "open_air_theatre_evening"
    type: "venue"
    capacity: 1          # substitute venue; also scarce

  - id: "sound_system_A"
    type: "equipment"
    capacity: 1          # professional PA system; one winner

  - id: "projector_A"
    type: "equipment"
    capacity: 1          # high-resolution projector; one winner

  - id: "volunteers_10"
    type: "staff"
    capacity: 1          # a pool of 10 volunteers assigned to one event

  - id: "sports_ground"
    type: "venue"
    capacity: 1          # main sports ground; exclusive use
